name: Validate and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Kernel, contracts, VM and portal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 qemu-system-x86 ovmf cmake ninja-build
          python -m pip install -r requirements-dev.txt
      - name: Validate all configurations and generate measured portal
        env:
          NW_LLVM_BIN: /usr/lib/llvm-18/bin
        run: python scripts/validate.py --qemu --record
      - name: Address and undefined-behavior sanitizers
        run: |
          clang-18 -std=c17 -O1 -g -DNW_HOST=1 -Iinclude -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all kernel/memory/map.c kernel/memory/pfn.c tests/host/sanitizers.c -o build/sanitizers
          ./build/sanitizers
      - name: Browser validation
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
          python website/scripts/serve.py > build/site-server.log 2>&1 &
          python -c "import time,urllib.request; time.sleep(2); assert urllib.request.urlopen('http://127.0.0.1:8765/windows-10/').status == 200"
          python tests/host/test_website.py
      - name: Verify source publication policy
        run: python scripts/review_staged.py --tracked
      - name: Preserve validation evidence and original kernel images
        uses: actions/upload-artifact@v4
        with:
          name: kernel-validation
          path: |
            build/**/*.json
            build/**/serial.log
            build/**/BOOTX64.EFI
            build/checked/exception.efi
            data/validation.json
          if-no-files-found: error
      - name: Upload static Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  windows:
    name: Microsoft ABI and CMake
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure and build
        run: |
          cmake --preset checked
          cmake --build --preset checked
      - name: Native Microsoft x64 contracts
        run: ctest --preset checked
      - name: Static analysis
        run: cmake --build build/cmake-checked --target analyze

  pages:
    name: Deploy official portal
    needs: [linux, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated portal
        id: deployment
        uses: actions/deploy-pages@v4
